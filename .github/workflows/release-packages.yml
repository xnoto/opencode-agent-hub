name: Build Release Packages

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v0.5.0)'
        required: true
        type: string
  pull_request:
    paths:
      - 'contrib/packaging/**'
      - '.github/workflows/release-packages.yml'
      - 'pyproject.toml'
      - 'src/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag to rebuild (e.g., v1.6.1)'
        required: true
        type: string

jobs:
  build-python:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_ref: ${{ steps.version.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name || github.sha }}

      - name: Determine version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          PROJECT_VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ -n "$REQUESTED_TAG" ]; then
            case "$REQUESTED_TAG" in
              v*) VERSION="${REQUESTED_TAG#v}" ;;
              *)
                echo "::error::Release tag must start with 'v': $REQUESTED_TAG"
                exit 1
                ;;
            esac
            if [ "$VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::Tag $REQUESTED_TAG contains version $VERSION, but pyproject.toml contains $PROJECT_VERSION"
              exit 1
            fi
          else
            VERSION="$PROJECT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - uses: astral-sh/setup-uv@v10
      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  build-rpm:
    runs-on: ubuntu-latest
    needs: build-python
    container:
      image: fedora:43
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-python.outputs.source_ref }}

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build python3-devel python3-pip python3-wheel \
            python3-hatchling python3-pydantic python3-prometheus_client \
            python3-requests python3-watchdog

      - name: Create source tarball
        run: |
          VERSION="${{ needs.build-python.outputs.version }}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          # Create tarball with correct naming for rpmbuild
          tar --transform "s,^,opencode-agent-hub-${VERSION}/," \
              -czf ~/rpmbuild/SOURCES/opencode-agent-hub-${VERSION}.tar.gz \
              src pyproject.toml README.md LICENSE contrib

      - name: Update and copy spec
        run: |
          VERSION="${{ needs.build-python.outputs.version }}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" contrib/packaging/rpm/opencode-agent-hub.spec
          # Use GitHub tarball URL format for Source0
          sed -i "s|^Source0:.*|Source0:        opencode-agent-hub-${VERSION}.tar.gz|" contrib/packaging/rpm/opencode-agent-hub.spec
          cp contrib/packaging/rpm/opencode-agent-hub.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: |
          rpmbuild -bb ~/rpmbuild/SPECS/opencode-agent-hub.spec
          mkdir -p rpms
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} rpms/ \;
          ls -la rpms/

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-packages
          path: rpms/
          if-no-files-found: error

  build-deb:
    runs-on: ubuntu-latest
    needs: build-python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-python.outputs.source_ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3-all \
            python3-hatchling pybuild-plugin-pyproject devscripts \
            python3-prometheus-client \
            python3-requests python3-watchdog

      - name: Prepare debian directory
        run: |
          VERSION="${{ needs.build-python.outputs.version }}"
          cp -r contrib/packaging/debian .
          # Update changelog version
          sed -i "1s/([^)]*)/($VERSION-1)/" debian/changelog

      - name: Build DEB
        run: |
          # Skip tests during package build — they run in CI separately.
          # pydantic v2 and other pip deps aren't available as system packages.
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b
          mkdir -p debs
          find .. -maxdepth 1 -name "*.deb" -exec cp {} debs/ \;
          ls -la debs/

      - uses: actions/upload-artifact@v7
        with:
          name: deb-packages
          path: debs/
          if-no-files-found: error

  build-aur:
    runs-on: ubuntu-latest
    needs: build-python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-python.outputs.source_ref }}

      - name: Update PKGBUILD version
        run: |
          VERSION="${{ needs.build-python.outputs.version }}"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" contrib/packaging/aur/PKGBUILD
          mkdir -p aur
          cp contrib/packaging/aur/PKGBUILD aur/

      - uses: actions/upload-artifact@v7
        with:
          name: aur-packages
          path: aur/

  upload-release:
    runs-on: ubuntu-latest
    needs: [build-python, build-rpm, build-deb, build-aur]
    if: ${{ github.event_name != 'workflow_dispatch' && (github.event_name == 'release' || inputs.tag_name != '') }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
          files: |
            artifacts/python-dist/*
            artifacts/rpm-packages/*
            artifacts/deb-packages/*
            artifacts/aur-packages/*

  publish-repo:
    runs-on: ubuntu-latest
    needs: [build-python, build-rpm, build-deb]
    if: github.event_name == 'release' || inputs.tag_name != ''
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-python.outputs.source_ref }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Import and validate GPG signing key
        env:
          EXPECTED_GPG_FINGERPRINT: 396877BFC1403AE7BF0C91CC31B16FDE7CB4A3B8  # pragma: allowlist secret
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is not configured"
            exit 1
          fi

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_DATA=$(gpg --batch --with-colons --list-secret-keys "$EXPECTED_GPG_FINGERPRINT")
          KEY_FPR=$(printf '%s\n' "$KEY_DATA" | awk -F: '$1 == "fpr" { print $10; exit }')
          KEY_EXPIRY=$(printf '%s\n' "$KEY_DATA" | awk -F: '$1 == "sec" { print $7; exit }')
          KEY_CAPABILITIES=$(printf '%s\n' "$KEY_DATA" | awk -F: '$1 == "sec" { print $12; exit }')

          if [ "$KEY_FPR" != "$EXPECTED_GPG_FINGERPRINT" ]; then
            echo "::error::Imported GPG key fingerprint does not match the expected signing key"
            exit 1
          fi
          if [[ "$KEY_CAPABILITIES" != *s* ]]; then
            echo "::error::Imported GPG key is not capable of signing"
            exit 1
          fi
          if [[ ! "$KEY_EXPIRY" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to determine GPG signing key expiry"
            exit 1
          fi

          if [ "$KEY_EXPIRY" -eq 0 ]; then
            echo "GPG signing key does not expire"
          else
            NOW_EPOCH=$(date +%s)
            if [ "$KEY_EXPIRY" -le "$NOW_EPOCH" ]; then
              echo "::error::GPG signing key has expired; package signing cannot continue"
              exit 1
            fi
            DAYS_LEFT=$(( (KEY_EXPIRY - NOW_EPOCH + 86399) / 86400 ))
            EXPIRY_DATE=$(date -u -d "@$KEY_EXPIRY" +%Y-%m-%d)
            echo "GPG signing key expires: $EXPIRY_DATE ($DAYS_LEFT days remaining)"
            if [ "$DAYS_LEFT" -lt 30 ]; then
              echo "::warning::GPG signing key expires in $DAYS_LEFT days; renew it soon"
            fi
          fi

          printf '%s:6:\n' "$KEY_FPR" | gpg --import-ownertrust
          echo "GPG_KEY_ID=$KEY_FPR" >> "$GITHUB_ENV"

      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm

      - name: Build APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p repo/apt
          cp artifacts/deb-packages/*.deb repo/apt/
          cd repo/apt
          
          # Generate package index
          dpkg-scanpackages --multiversion . > Packages
          gzip -k -f Packages
          
          # Generate release file
          apt-ftparchive release . > Release
          
          # Sign release
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
            printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          else
            gpg --batch --yes --pinentry-mode loopback --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
            gpg --batch --yes --pinentry-mode loopback --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          fi

      - name: Build RPM repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p repo/rpm
          cp artifacts/rpm-packages/*.rpm repo/rpm/
          cd repo/rpm
          
          # Configure RPM signing macros
          cat > ~/.rpmmacros << EOF
          %_gpg_name $GPG_KEY_ID
          %__gpg_sign_cmd %{__gpg} gpg --batch --yes --pinentry-mode loopback --no-armor %{?_gpg_sign_cmd_extra_args} -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          
          # Sign RPM packages
          for rpm in *.rpm; do
            if [ -n "$GPG_PASSPHRASE" ]; then
              printf '%s\n' "$GPG_PASSPHRASE" | rpmsign --addsign "$rpm"
            else
              rpmsign --addsign "$rpm"
            fi
          done
          
          # Generate repo metadata
          createrepo_c .
          
          # Sign repodata
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --default-key "$GPG_KEY_ID" --detach-sign --armor repodata/repomd.xml
          else
            gpg --batch --yes --pinentry-mode loopback --default-key "$GPG_KEY_ID" --detach-sign --armor repodata/repomd.xml
          fi

      - name: Export public key
        run: |
          gpg --armor --export "$GPG_KEY_ID" > repo/KEY.gpg

      - name: Create repo config files
        run: |
          # APT sources list
          cat > repo/xnoto.list << 'EOF'
          deb [signed-by=/etc/apt/keyrings/xnoto.gpg] https://xnoto.github.io/opencode-agent-hub/apt ./
          EOF
          
          # DNF/YUM repo file
          # metadata_expire=300 ensures dnf checks for new packages every 5 minutes
          # (GitHub Pages CDN caches for max 10 minutes, so 5 min is a safe middle ground)
          cat > repo/xnoto.repo << 'EOF'
          [xnoto]
          name=xnoto packages
          baseurl=https://xnoto.github.io/opencode-agent-hub/rpm
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://xnoto.github.io/opencode-agent-hub/KEY.gpg
          metadata_expire=300
          EOF

      - name: Create index page
        run: |
          cat > repo/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>opencode-agent-hub packages</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
              pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
              h2 { margin-top: 2rem; }
            </style>
          </head>
          <body>
            <h1>opencode-agent-hub</h1>
            <p>Linux package repository for <a href="https://github.com/xnoto/opencode-agent-hub">opencode-agent-hub</a>.</p>
            
            <h2>Debian / Ubuntu (APT)</h2>
            <pre>
          # Add GPG key
          curl -fsSL https://xnoto.github.io/opencode-agent-hub/KEY.gpg | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/xnoto.gpg

          # Add repository
          echo "deb [signed-by=/etc/apt/keyrings/xnoto.gpg] https://xnoto.github.io/opencode-agent-hub/apt ./" | sudo tee /etc/apt/sources.list.d/xnoto.list

          # Install
          sudo apt update
          sudo apt install opencode-agent-hub
            </pre>
            
            <h2>Fedora / RHEL (DNF)</h2>
            <pre>
          # Add repository
          sudo curl -o /etc/yum.repos.d/xnoto.repo https://xnoto.github.io/opencode-agent-hub/xnoto.repo

          # Import or refresh the repository signing key
          sudo rpm --import https://xnoto.github.io/opencode-agent-hub/KEY.gpg

          # Install
          sudo dnf install opencode-agent-hub
            </pre>
            
            <h2>Arch Linux (AUR)</h2>
            <pre>
          yay -S opencode-agent-hub
            </pre>
            
            <h2>Direct Downloads</h2>
            <p>See <a href="https://github.com/xnoto/opencode-agent-hub/releases">GitHub Releases</a> for direct package downloads.</p>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          destination_dir: .
          keep_files: false
